<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Header Tienda</title>
</head>
<body>

<nav class="navbar navbar-expand-lg flex-column">

    <div class="container-fluid d-flex align-items-center justify-content-between top-bar">

        <a class="navbar-brand text-white fw-bold" href="#">
            <img src="/assets/logo.png" alt="Pokecard" class="logo">
        </a>

        <form class="d-flex search-bar">
            <input class="form-control" type="search" placeholder="Buscar productos...">
        </form>

        <div class="d-flex">
            @if(!this.usuario){
            <a class="nav-link" href="/iniciosesion"><i class="bi bi-person icon-btn"></i></a>
            }
            @if(this.usuario!){
            <a class="nav-link mt-2" href="/menu">{{usuario.nombre}}</a>
            }
            <a href="/carrito" class="position-relative d-inline-block text-white">
            <i class="bi bi-bag icon-btn"></i>
            <span class="top-10 start-100 translate-middle badge rounded-pill bg-danger">
            {{cantidad()}}
        </span>
        </a>
        </div>

    </div>


    <div class="container-fluid menu-bar">
        <div class="collapse navbar-collapse justify-content-center show">
            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="/ofertas"><i class="bi"></i>Ofertas</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/cartas"><i class="bi"></i> Cartas Pokémon</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/boxes"><i class="bi"></i> Mystery Boxes</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/accesorios"><i class="bi"></i> Accesorios</a>
            </ul>
        </div>
    </div>

</nav>


</body>
</html>
