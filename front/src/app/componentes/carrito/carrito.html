<app-cabecera></app-cabecera>
<main class="pt-5 pb-5"> 

     <div class="d-flex justify-content-center pb-2">
        <h1>Listado de productos</h1>
    </div>

    <div class="brd"> 
    <table class="table table-dark table-hover align-middle">
      <thead>
        <tr>

          <th>Producto</th>
          <th>Nombre</th>
          <th>Precio</th>
          <th>Cantidad</th>
          <th>Subtotal</th>
          <th><i class="bi bi-tools"></i></th>
        </tr>
      </thead>
      <tbody>
        @for (producto of carrito(); track producto.id) {
        <tr class="table-dark">

          <td><img [src]="'http://localhost:3000/uploads/'+producto.ruta_imagen" alt="{{producto.nombre}}" height="50" width="50"></td>
          <td>{{producto.nombre}}</td>
          <td>{{producto.precio}}</td>
          <td>{{producto.cantidad}}</td>
          <td>{{producto.subtotal}}</td>
          <td><div class="btn-group">
            <a type="button" class="btn btn-outline-primary boton" (click)="eliminarProducto(producto.id)"><i class="bi bi-trash"></i></a>
          </div></td>
        </tr>
        }
      </tbody>
    </table>
    @if(carrito().length > 0){
    <div class="d-flex w-100 justify-content-end align-items-center mt-4 mb-4">
    <button [routerLink]="['/pago']" class="btn btn-outline-primary btn-dragging letra boton" data-bs-toggle="modal" data-bs-target="#modalCrear">Realizar compra</button>
  </div>
    }
    </div>
    
</main>
<app-piepagina></app-piepagina>
